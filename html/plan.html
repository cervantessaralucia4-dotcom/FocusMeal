<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Planes - FocusMeal</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<div class="dashboard">

   <header class="navbar">
    <div class="logo">
        <img src="../img/logo.png" alt="FocusMeal">
        <h2>Focus Meal</h2>
    </div>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="plan.html">Planes</a>
        <a href="login.html">Ingresar</a>
    </nav>
</header>

    <!-- Contenido principal -->
    <main class="main-content">

        <h1>Elige tu plan</h1>

        <div class="cards-container">

            <div class="card">
                <h2>Bajar de peso</h2>
                <p>Déficit calórico controlado</p>
                <form action="../php/guardar_plan.php" method="POST">
                  <input type="hidden" name="plan" value="bajar_peso">

                </form>

            </div>

            <div class="card">
                <h2>Plan balanceado</h2>
                <p>Mantén tu peso ideal</p>
                <form action="../php/guardar_plan.php" method="POST">
                    <input type="hidden" name="plan" value="manteber_peso">

        </div>
