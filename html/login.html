            <h2 class="text-center mb-2">Iniciar sesión</h2>

            <form id="loginForm" class="validate-form" action="/php/login.php" method="POST" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="correo" placeholder="ejemplo@correo.com" required>

                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="contraseña" minlength="8" placeholder="••••••••" required>
                <div class="valid-feedback"><i class="bi bi-check-circle-fill text-success"></i> Contraseña válida</div>
                <div class="invalid-feedback"><i class="bi bi-x-circle-fill text-danger"></i> La contraseña debe tener al menos 8 caracteres.</div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
              </div>
              <p class="text-center mt-3 mb-0 small">¿No tienes cuenta? <a href="/html/registro.html">Regístrate</a></p>
